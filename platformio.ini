; AquaBeacon メイン基板 動作確認ファーム (C-MAIN v4.5 / P-MAIN v5.8 共用)
;   env:pico2w  -> CHILD_MAIN  (Pico 2 W + BNO085 SPI0 + 3ボタン + LED GP14 + I2C センサ + microSD)
;   env:parent  -> PARENT_MAIN (Pico 2 W + 3ボタン GP26 + LED GP2 + I2C センサ/LIS3MDL + microSD + GNSS UART1 + PPS + TX 温度)
;   ピン定義は include/child_main_pins.h が唯一の正 (docs/AquaBeacon_MAIN_UI_GPIO_コネクタ表.md 準拠、BOARD_PARENT で切替)
;   TD04A_test と同じ platform / board を使う

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BNO08x@^1.2.5
    adafruit/Adafruit BusIO@^1.16.1

[env:pico2w]
build_flags =
    -Iinclude

[env:parent]
build_flags =
    -Iinclude
    -DBOARD_PARENT
